[workflow]

brief_template = "{project-root}/_bmad/custom/templates/brief-template.md"

persistent_facts = [
  "Whenever the user requests, confirms, or makes a substantive change to the brief's content during this conversation (any point before or after Finalize — not only at on_complete): first, if brief.md's current frontmatter status is 'approved', edit it back to 'draft' and save that change before or together with the content edit — an approved brief whose content changes is no longer approved, regardless of whether the change is committed to git. Then log the update immediately via skill:agent-project-logger with action 'Brief updated via chat: <one-line summary of the change>' (include 'status reverted to draft' in the action text if the revert applied), in addition to the standard .memlog.md entry. Do this for each such change as it happens, not batched at the end.",
]

on_complete = [
  "skill:agent-project-logger with action 'Brief generated'",

  "skill:experion-brief-review",

  "skill:agent-project-logger with action 'Brief review report generated'",

  "Tell the user the brief and review report are ready, and ask directly: have you read the review report and do you approve the brief? Wait for an explicit affirmative response. If they decline or don't confirm, tell them the brief remains in draft status, log this via skill:agent-project-logger with action 'Brief approval declined or deferred', and stop here.",

  "If they approved, ask a second, separate confirmation: 'Please confirm you have read through the entire brief document itself, not just the review report, before I mark it approved.' Wait for an explicit second affirmative. If they decline this second confirmation, leave status as draft, log 'Brief approval declined at second confirmation' via skill:agent-project-logger, and stop here.",

  "Only after both confirmations are explicitly given: edit brief.md's frontmatter status field to 'approved' and save the file. Then, as a separate step after that save completes, run a terminal command to read brief.md's actual current last-modified timestamp from the filesystem (not the current time — the file's own recorded mtime after your edit was saved). Write that exact value into a new or updated file at {project-root}/_bmad/custom/approval-state.json as {\"brief_path\": \"<resolved path to brief.md>\", \"approved_mtime\": \"<that mtime>\"}. Then log via skill:agent-project-logger with action 'Brief approved by {user_name}'.",,
]