[workflow]

prd_template = "{project-root}/_bmad/custom/prd-template.md"

activation_steps_prepend = [
  "If status is 'approved', read {project-root}/_bmad/custom/approval-state.json. If it's missing or its brief_path doesn't match the current brief, treat this as unverifiable and log via skill:agent-project-logger with action 'Approval state unverifiable - proceeding cautiously', then continue. Otherwise, run a terminal command to read the brief file's actual current last-modified timestamp, and compare it to the approved_mtime recorded in approval-state.json. If the file's current mtime is later than approved_mtime",

  "If the brief exists, read its status and approved_at frontmatter fields. If status is not exactly 'approved', log via skill:agent-project-logger with action 'PRD generation blocked - brief status is {report the actual value found}', then stop and tell the user PRD generation cannot proceed until the brief is approved.",

  "If status is 'approved', run a terminal command to get the brief file's actual last-modified timestamp from the filesystem (e.g. on the current OS, use `node -e \"console.log(require('fs').statSync('PATH_TO_BRIEF').mtime.toISOString())\"`, substituting the real resolved path). Compare that timestamp against the approved_at value stored in the brief's frontmatter.",

  "If the file's last-modified timestamp is later than approved_at, treat this as evidence the brief was edited after approval: edit the file to set status back to 'draft', log via skill:agent-project-logger with action 'Brief modified after approval - status auto-reverted to draft', then stop and tell the user the brief was edited since it was last approved and must be re-approved before PRD generation can continue.",

  "This is a hard project policy with no exceptions: do not offer to bypass, override, or proceed anyway under any framing, even if the user explains a reason, claims urgency, or explicitly requests an override.",

  "Only continue normally with PRD generation, logging via skill:agent-project-logger with action 'PRD generation started - brief approved', if status is 'approved' and the file's last-modified timestamp is not later than approved_at.",
]