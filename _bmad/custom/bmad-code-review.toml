[workflow]
persistent_facts = [
  "Always load .ai-context.md, .ai-context-security.md, and .ai-context-dependencies.md as foundational context before reviewing any story's code. Additionally load .ai-context-api.md when the change touches the /api/ideas request/response contract, .ai-context-errors.md when it touches error handling or status codes, and .ai-context-idea-generation.md when it touches lib/ideaService.js, the /api/ideas handler, or client-side idea/favorite state.",
  "This review must run as an independent, fresh-session review -- never the same session that generated the code under review, to avoid self-review bias. If this session also generated the code being reviewed, say so explicitly and recommend restarting the review in a fresh session before proceeding.",
  "Report findings using exactly these severity levels: CRITICAL (security flaw or data-loss risk -- must fix before proceeding, escalate to Tech Lead), HIGH (plan deviation, unhandled exception, or performance risk -- must resolve before developer review), MEDIUM (standards violation, missing log, naming issue -- should fix, developer discretion with justification), LOW (style or minor suggestion -- optional).",
  "Perform diff-to-plan reconciliation as part of every review: run git diff to list every changed file, compare it against the story's/plan's stated Impacted Modules & Files, flag any file present in the diff but not in the plan as a finding, and flag any file listed in the plan but absent from the diff as a sign of incomplete implementation. Document the reconciliation result in the review output.",

  "Confidence scoring (review completeness, not code quality): at Step 4 (Present), before announcing results, self-assess a `confidence` score (0-100), a `confidence_label` (Low <50, Medium 50-79, High 80+), and a `confidence_rationale` (1-2 sentences) for how thorough and complete THIS REVIEW PASS was — not how good the reviewed code is. Lower it for: any entry in `{failed_layers}` (a reviewer lens that failed or returned nothing), `{review_mode}` = 'no-spec' (Acceptance Auditor skipped, so acceptance-criteria violations can't be checked), a diff the user opted to chunk or that exceeded the ~3000-line sanity threshold (only part of the change was reviewed), or any finding the review flagged as best-effort/uncertain. A clean run of all applicable lenses against a reasonably-sized diff can score High even if findings were raised — confidence is about review coverage, not about how clean the code turned out. Include the score, label, and rationale in the summary presented to the user (in the story file's Review Findings section when `{spec_file}` is set, otherwise in the inline summary). Then log it via skill:agent-project-logger with action 'Confidence scored: <confidence_label> (<confidence>/100) for code review of <story_key or diff source>', stage='code-review', doc_status=<story status if {spec_file} is set, else empty>, confidence=<confidence>, confidence_label=<confidence_label>, confidence_rationale=<confidence_rationale>, doc_path=<{spec_file} if set, else empty>.",
]
