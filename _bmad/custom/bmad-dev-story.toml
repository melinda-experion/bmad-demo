[workflow]
persistent_facts = [
  "Always load {project-root}/_bmad-output/project-context.md as foundational context before working on any story -- it holds the technology stack, source layout, data conventions, and Global Do-Not-Do rules derived from the approved architecture spine.",
  "Plan-first hard gate: before generating or modifying any code, write the implementation plan to '{story-file-directory}/{story_key}-plan.md' with frontmatter (story, date, status: pending-approval, confidence, confidence_label, confidence_rationale) and these sections: Scope Summary, Impacted Modules & Files, Detailed Design Approach, Data Model Usage, API/Interface Changes, Error Handling & Edge Cases, Security Considerations, Performance Considerations, Test Strategy, Risks/Assumptions & Dependencies, Context Files Consulted, Rationale Summary. Present this plan to the user and STOP. Do not proceed to code generation until the user has typed the exact phrase 'Plan reviewed and approved. Proceed with code generation strictly as per this plan.' A general affirmative ('yes', 'looks good', 'go ahead') is NOT sufficient and must not be treated as approval. Once approved, update the plan file's frontmatter status to 'approved'. If the plan changes materially after approval, the gate resets (set status back to 'pending-approval') and must be satisfied again before further code generation proceeds.",

  "Confidence scoring: before presenting the implementation plan, self-assess a `confidence` score (0-100), a `confidence_label` (Low <50, Medium 50-79, High 80+), and a `confidence_rationale` (1-2 sentences) for how much of the plan rests on confirmed input (approved architecture/PRD/story acceptance criteria) versus inference — lower it for each flagged assumption, unresolved model/library/version uncertainty, or story detail the plan had to guess at. Write all three into the plan file's frontmatter alongside the other fields, and surface the score and rationale to the user in the same message that presents the plan. Immediately after writing the plan file, log it via skill:agent-project-logger with action 'Confidence scored: <confidence_label> (<confidence>/100) for implementation plan <story_key>' , stage='implementation-plan', doc_status='pending-approval', confidence=<confidence>, confidence_label=<confidence_label>, confidence_rationale=<confidence_rationale>, doc_path=<resolved path to the plan file>.",
  "Generated code must stay strictly within the approved plan's stated scope (files, modules, schemas). Do not modify files outside that scope, introduce new patterns, or refactor out-of-scope code without stopping to ask first.",
]

# Runs after the story is complete and its Status has been set to "review"
# (File List is final at this point). Scores actual generated code
# objectively -- distinct from the LLM self-assessed plan confidence above,
# which only rates the *plan* before code exists. This uses skill:confidence-scorer,
# which computes every number from measured tool output (test runner, linter,
# git diff, approval-state.json), never from the model's own impression.
on_complete = "Invoke skill:confidence-scorer once per file in the story's File List (never batched, never skipped). For each file: derive tests-passed/tests-failed from the regression suite already run in Step 7, filtered to tests touching that file; derive lint-errors/lint-warnings from the project's linter run against that file; derive lines-changed from `git diff --stat {baseline_commit} -- <file>`. Pass `--revision-cycles` = the count of prior 'Senior Developer Review (AI)' cycles already recorded in this story's Change Log (0 on a first pass), `--doc-status \"review\"`, `--doc-type \"{story_key}\"`, `--stage \"stories\"`. Confirm exactly one audit log row was appended per File List entry, then report the file/confidence/label table to the user before ending the session."
