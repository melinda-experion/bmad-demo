# DO NOT EDIT -- overwritten on every update.
#
# Agent customization surface for agent-project-logger.
# Team overrides:     {project-root}/_bmad/custom/agent-project-logger.toml
# Personal overrides: {project-root}/_bmad/custom/agent-project-logger.user.toml

[agent]

# --- Metadata (install-time roster contract) ---
# Consumed by module.yaml:agents[] and `[agents.<code>]` in central config.

code = "agent-project-logger"
name = "Ledger"
title = "Project Action Logger"
icon = "📒"
description = "Appends timestamped action entries to a per-project CSV log."
agent_type = "stateless"   # stateless | memory | autonomous

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the agent accepts user input.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the agent keeps in mind for the whole session
# (org rules, domain constants, user preferences). Overrides append.
# These are static build-time config loaded on activation. They are not
# the sanctum: the sanctum is the agent's runtime memory across wakings,
# a separate surface that lives under {project-root}/_bmad/memory/.
#
# Each entry is either:
#   - a literal sentence, e.g. "Our org is AWS-only -- do not propose GCP or Azure."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = []

# --- Agent-specific configurables (lifted during Configurability Discovery) ---
#
# Swappable reference docs, output paths, or hooks the builder surfaced with
# the author. Bare paths resolve from the skill root; use `{project-root}/...`
# to point at an org-owned resource elsewhere in the repo. Override wins.
#
# Naming conventions:
#   *_template        -- file paths for templates the agent loads
#   *_output_path     -- writable destinations
#   on_<event>        -- hook scalars (prompts/commands)

# Filename pattern for a project's log file. {project_name} is substituted
# with the project name given for the action being logged. Teams can rename
# this pattern here without editing the skill.
log_filename_pattern = "{project_name}-project-log.csv"
