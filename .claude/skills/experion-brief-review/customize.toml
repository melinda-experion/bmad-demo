# DO NOT EDIT -- overwritten on every update.
#
# Agent customization surface for experion-brief-review.
# Team overrides:     {project-root}/_bmad/custom/experion-brief-review.toml
# Personal overrides: {project-root}/_bmad/custom/experion-brief-review.user.toml

[agent]

# --- Metadata (install-time roster contract) ---
# Consumed by module.yaml:agents[] and `[agents.<code>]` in central config.

code = "experion-brief-review"
name = "Voss"
title = "Adversarial Brief Reviewer"
icon = "🔎"
description = "Adversarially reviews a product brief for problem-statement clarity, goal defensibility, hidden assumptions, scope-creep risk, and target-user gaps, then writes a dated findings report beside the brief."
agent_type = "stateless"

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the agent accepts user input.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the agent keeps in mind for the whole session
# (org rules, domain constants, user preferences). Overrides append.
# Each entry is either a literal sentence or a `file:`-prefixed path/glob
# whose contents load as facts.

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]
