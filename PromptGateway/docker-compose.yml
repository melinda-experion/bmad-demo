version: "3.9"

services:
  prompt-gateway:
    build: .
    image: prompt-gateway:latest
    container_name: prompt-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - AUDIT_DB_PATH=/app/logs/audit.db
      - LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
      - ./policy.yaml:/app/policy.yaml:ro
    depends_on:
      - ollama
    networks:
      - gateway-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - gateway-net
    # Uncomment to enable GPU acceleration (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  gateway-net:
    driver: bridge

volumes:
  ollama-models:
