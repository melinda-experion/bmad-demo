# =============================================================================
# Prompt Gateway - Enterprise Policy Configuration
# =============================================================================
# This file defines validation rules, risk weights, and decision thresholds
# for the prompt gateway. Edit this file to tune behavior without redeploying.
# =============================================================================

version: 1

# ---------------------------------------------------------------------------
# Global decision thresholds (0-100 aggregate risk score)
# ---------------------------------------------------------------------------
decision:
  allow_below: 30 # score < 30            -> ALLOW
  flag_below: 60 # 30 <= score < 60      -> FLAG (allowed, logged for review)
  block_at_or_above: 60 # score >= 60           -> BLOCK
  hard_block_categories: # any finding in these categories forces BLOCK regardless of score
    - secret_leak
    - critical_injection
    - credit_card

# ---------------------------------------------------------------------------
# Per-validator weight in the aggregate risk score (must sum roughly to 1.0)
# ---------------------------------------------------------------------------
weights:
  regex: 0.15
  pii: 0.25
  toxicity: 0.15
  injection: 0.30
  llm: 0.15

# ---------------------------------------------------------------------------
# Token / size limits
# ---------------------------------------------------------------------------
tokens:
  max_prompt_tokens: 4096
  warn_prompt_tokens: 2048
  encoding: cl100k_base

# ---------------------------------------------------------------------------
# Regex validator rules
# ---------------------------------------------------------------------------
regex_rules:
  - name: sql_injection_pattern
    pattern: "(?i)(\\bunion\\b.{1,20}\\bselect\\b|\\bdrop\\s+table\\b|\\bor\\s+1=1\\b|;--)"
    category: sql_injection
    risk_score: 70
    description: Possible SQL injection payload

  - name: shell_command_pattern
    pattern: "(?i)(\\brm\\s+-rf\\b|\\bwget\\s+http|\\bcurl\\s+http.*\\|\\s*sh\\b|;\\s*(cat|nc|bash)\\s)"
    category: command_injection
    risk_score: 75
    description: Possible shell/command injection payload

  - name: path_traversal
    pattern: "(\\.\\./){2,}|(\\.\\.\\\\){2,}"
    category: path_traversal
    risk_score: 55
    description: Path traversal sequence detected

  - name: script_tag
    pattern: "(?i)<script[^>]*>.*?</script>"
    category: xss
    risk_score: 60
    description: Embedded script tag (possible XSS)

  - name: private_key_block
    pattern: "-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"
    category: secret_leak
    risk_score: 95
    description: Embedded private key material

# ---------------------------------------------------------------------------
# PII validator rules
# ---------------------------------------------------------------------------
pii_rules:
  email:
    enabled: true
    risk_score: 20
  phone_number:
    enabled: true
    risk_score: 20
  ssn:
    enabled: true
    risk_score: 60
  credit_card:
    enabled: true
    risk_score: 90
  ip_address:
    enabled: true
    risk_score: 10
  aws_access_key:
    enabled: true
    risk_score: 95
  generic_api_key:
    enabled: true
    risk_score: 85
  password_field:
    enabled: true
    risk_score: 50

# ---------------------------------------------------------------------------
# Toxicity validator rules
# ---------------------------------------------------------------------------
toxicity:
  enabled: true
  block_threshold: 0.75 # normalized 0-1 score
  flag_threshold: 0.4
  categories:
    - profanity
    - hate_speech
    - harassment
    - violence
    - self_harm

# ---------------------------------------------------------------------------
# Prompt injection validator rules
# ---------------------------------------------------------------------------
injection:
  enabled: true
  patterns:
    - name: ignore_instructions
      pattern: "(?i)\\bignore\\s+(all\\s+)?(previous|prior|above)\\s+(instructions?|prompts?|rules?)\\b"
      risk_score: 85
      category: critical_injection
    - name: system_prompt_override
      pattern: "(?i)\\byou\\s+are\\s+now\\b|\\bnew\\s+system\\s+prompt\\b|\\bact\\s+as\\s+(?!an?\\s+assistant)"
      risk_score: 70
      category: injection
    - name: dan_jailbreak
      pattern: "(?i)\\bDAN\\b|\\bdo\\s+anything\\s+now\\b|\\bjailbreak\\b"
      risk_score: 80
      category: critical_injection
    - name: role_escape
      pattern: "(?i)\\bpretend\\s+(you\\s+)?(are|to\\s+be)\\b.{0,40}\\bno\\s+(restrictions|rules|filters)\\b"
      risk_score: 80
      category: critical_injection
    - name: delimiter_confusion
      pattern: "(?i)(\\[/?(system|assistant|user)\\]|###\\s*(system|instruction)\\b|<\\|.*?\\|>)"
      risk_score: 60
      category: injection
    - name: reveal_system_prompt
      pattern: "(?i)\\b(reveal|show|print|repeat)\\b.{0,25}\\b(system\\s+prompt|instructions|guidelines)\\b"
      risk_score: 65
      category: injection
    - name: base64_payload
      pattern: "([A-Za-z0-9+/]{40,}={0,2})"
      risk_score: 40
      category: obfuscation
    - name: pretend_role_override
      pattern: "(?i)\\bpretend\\s+(that\\s+)?you\\s+are\\b"
      risk_score: 70
      category: role_manipulation

    - name: unrestricted_ai
      pattern: "(?i)\\b(unrestricted|unfiltered|uncensored|unlimited)\\s+ai\\s+(model|assistant|system)?\\b"
      risk_score: 90
      category: critical_injection

    - name: ignore_previous_instructions
      pattern: "(?i)\\bignore\\s+(all\\s+)?(previous|prior|above)\\s+(instructions?|prompts?|rules?|restrictions?)\\b"
      risk_score: 85
      category: critical_injection

    - name: bypass_restrictions
      pattern: "(?i)\\b(ignore|bypass|override|disable|remove)\\s+(all\\s+)?(restrictions?|guardrails?|safety|security|filters?)\\b"
      risk_score: 95
      category: critical_injection

    - name: exploit_request
      pattern: "(?i)\\b(exploit|hack|compromise|attack|breach)\\s+(a\\s+)?(web\\s+server|server|system|application|website)\\b"
      risk_score: 98
      category: malicious_request

# ---------------------------------------------------------------------------
# Local LLM (Ollama) validator
# ---------------------------------------------------------------------------
llm_validator:
  enabled: true
  provider: ollama
  base_url: "http://192.168.1.5:11434"
  # base_url: "http://localhost:11434"
  model: "llama3:latest"
  fallback_models:
    - "qwen2.5:7b"
    - "gemma2:9b"
  timeout_seconds: 15
  temperature: 0.0
  max_retries: 1
  fail_open: true # if the LLM is unreachable, do not block the request on its account

# ---------------------------------------------------------------------------
# Allowed downstream models this gateway may forward validated prompts to
# ---------------------------------------------------------------------------
allowed_models:
  - llama3.2
  - llama3.1
  - qwen2.5:7b
  - gemma2:9b
  - mistral
  - llama3:latest

# ---------------------------------------------------------------------------
# Audit logging
# ---------------------------------------------------------------------------
audit:
  enabled: true
  db_path: "logs/audit.db"
  store_raw_prompt: false # if false, only a hash + truncated preview is stored
  preview_chars: 120
  retention_days: 90
