<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BMAD Idea Launcher</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>BMAD Idea Launcher</h1>
        <p>Turn a rough prompt into three starter ideas.</p>
        <textarea
          id="prompt"
          placeholder="Describe the problem or experiment you want to explore..."
        ></textarea>
        <div class="actions">
          <button id="generate" class="primary">Generate ideas</button>
          <button id="clear" class="secondary">Clear</button>
        </div>
        <div id="status" class="status">Enter a prompt to begin.</div>
        <div id="error" class="error"></div>
        <div id="results" class="results"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
